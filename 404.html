<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Signal</title>
<script>
  /* A share link whose static page hasn't been built yet (/s/<date>/<section>/[<item>/])
     still lands on the right card or item in the app. Anything else goes home. */
  (function () {
    var m = location.pathname.match(/^\/s\/(\d{4}-\d{2}-\d{2})\/([a-z]+)\/(?:([hc]?\d{1,3})\/?)?$/);
    var to = '/';
    if (m) to = '/?d=' + m[1] + '&s=' + m[2] + (m[3] ? '&i=' + m[3] : '');
    location.replace(to);
  })();
</script>

</body>
