<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Signal — Daily Intelligence Briefing</title>
  <meta name="description" content="What matters in AI today: news, research papers, trending repos, Hugging Face models, videos and jobs — curated daily.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="canonical" href="https://aisignal.builtbynavin.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI Signal">
  <meta property="og:title" content="AI Signal — Daily Intelligence Briefing">
  <meta property="og:description" content="What matters in AI today: news, research papers, trending repos, Hugging Face models, videos and jobs — curated daily.">
  <meta property="og:url" content="https://aisignal.builtbynavin.com/">
  <meta property="og:image" content="https://aisignal.builtbynavin.com/assets/og/site.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AI Signal — Daily Intelligence Briefing">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AI Signal — Daily Intelligence Briefing">
  <meta name="twitter:description" content="What matters in AI today, curated daily.">
  <meta name="twitter:image" content="https://aisignal.builtbynavin.com/assets/og/site.jpg">
  <script>
    /* Set theme before CSS loads to avoid flash */
    (function(){
      var t=localStorage.getItem('ais-theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      document.documentElement.classList.add('no-transition');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="30" height="30" viewBox="-0.5 -1 13 13" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="5" y="0" width="2" height="1" fill="#F4BF4A"/>
          <rect x="5" y="1" width="2" height="1" fill="#1F7F72"/>
          <path fill="#2FB3A0" d="M1 2h10v1h1v6h-1v1H1V9H0V3h1zM2 10h2v1H2zM8 10h2v1H8z"/>
          <rect x="2" y="4" width="8" height="4" fill="#EFFBF9"/>
          <rect x="3.1" y="5.25" width="0.8" height="1.5" fill="#1A1A1A"/>
          <rect x="8.1" y="5.25" width="0.8" height="1.5" fill="#1A1A1A"/>
        </svg>
      </div>
      <div class="brand-info">
        <span class="brand-name">AI Signal</span>
        <span class="brand-sub">Daily Briefing</span>
      </div>
    </div>

    <div class="date-widget">
      <div class="date-label" id="sidebar-date">—</div>
      <div class="date-row">
        <button class="ctrl-btn" id="prev-btn" title="Previous day">‹</button>
        <select id="date-select" aria-label="Select date"></select>
        <button class="ctrl-btn" id="next-btn" title="Next day">›</button>
      </div>
    </div>

    <nav class="section-nav" id="sidebar-nav"></nav>

    <div class="sidebar-social">
      <div class="social-label">Watch the video briefing</div>
      <div class="social-links">
        <a class="social-link social-yt" href="https://www.youtube.com/channel/UCecaCYe5iZ3CVqOzs52inlw" target="_blank" rel="noopener noreferrer" aria-label="AI Signal on YouTube">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
          <span>YouTube</span>
        </a>
        <a class="social-link social-tt" href="https://www.tiktok.com/@ai.signal.daily" target="_blank" rel="noopener noreferrer" aria-label="AI Signal on TikTok">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2V2h-3.4v13.7a2.9 2.9 0 0 1-5.2 1.7 2.9 2.9 0 0 1 3.2-4.5V9.4a6.3 6.3 0 0 0-5.4 10.7 6.3 6.3 0 0 0 10.8-4.4V8.7a8.2 8.2 0 0 0 4.8 1.5V6.8a4.8 4.8 0 0 1-1-.1Z"/></svg>
          <span>TikTok</span>
        </a>
      </div>
    </div>

    <div class="sidebar-foot">
      <span class="live-dot"></span>
      <span class="live-text">Signal Active</span>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="top-bar">
      <div class="bar-left">
        <button class="hamburger" id="menu-btn" aria-label="Toggle navigation">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor">
            <rect width="18" height="2" rx="1"/>
            <rect y="6" width="18" height="2" rx="1"/>
            <rect y="12" width="18" height="2" rx="1"/>
          </svg>
        </button>
        <div class="bar-title-group">
          <span class="bar-pub">Intelligence Briefing</span>
          <span class="bar-sep">·</span>
          <span class="bar-date" id="top-date">—</span>
        </div>
      </div>
      <div class="bar-right">
        <div class="bar-stats" id="top-stats"></div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <svg class="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content-area" id="content">
      <div class="blank-state">
        <div class="blank-spinner">⬡</div>
        <span>Loading briefing…</span>
      </div>
    </main>
  </div>

  <div class="tg-widget" id="tg-widget">
    <div class="tg-card" id="tg-card" role="complementary" aria-label="Join the Telegram channel">
      <button class="tg-close" id="tg-close" aria-label="Minimize">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="1" y1="1" x2="11" y2="11"/>
          <line x1="11" y1="1" x2="1" y2="11"/>
        </svg>
      </button>
      <div class="tg-card-body">
        <div class="tg-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M21.5 3.5 2.7 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.9 5.8c.2.6.4.9.9.9.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14c.3-1.3-.4-1.8-1.3-1.4Z" fill="var(--accent)"/>
          </svg>
        </div>
        <div class="tg-copy">
          <span class="tg-title">AI Signal on Telegram</span>
          <span class="tg-sub">Daily briefing, straight to your feed.</span>
        </div>
      </div>
      <a class="tg-join" href="https://t.me/ai_newsletter_channel" target="_blank" rel="noopener noreferrer">
        Join Channel
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"/>
          <polyline points="7 7 17 7 17 17"/>
        </svg>
      </a>
    </div>

    <button class="tg-fab" id="tg-fab" aria-label="Open Telegram channel card">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M21.5 3.5 2.7 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.9 5.8c.2.6.4.9.9.9.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14c.3-1.3-.4-1.8-1.3-1.4Z" fill="#fff"/>
      </svg>
      <span class="tg-fab-dot"></span>
    </button>
  </div>

  <script src="share-model.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
